[package]
name = "topos-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "The static site generator behind shergin.github.io/topos"
license = "MIT OR Apache-2.0"

[[bin]]
name = "site"
path = "src/main.rs"

[dependencies]
topos = { path = "..", features = ["evcxr"] }
topos-plates = { path = "plates" }
malevich = "1.22"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
